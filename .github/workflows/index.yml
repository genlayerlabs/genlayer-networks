name: Rebuild deployment index

# index.json lists every deployment folder (newest first). The UIs
# (genlayer-consensus-monitor, -vesting, -governance) read it from
# raw.githubusercontent.com, so it is regenerated on every push to main and
# committed back when it changed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deployment-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the index records when each folder was added
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Rebuild only when the folder list or a folder's metadata changed, so a
      # push that touches nothing the index records does not get a bot commit.
      - name: Rebuild index.json when it is stale
        run: |
          if node scripts/build-index.mjs --check; then
            exit 0
          fi
          node scripts/build-index.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: rebuild deployment index"
          git push
